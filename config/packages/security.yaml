security:
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: subject

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\OidcAuthenticator
            entry_point: App\Security\OidcAuthenticator
            logout:
                path: logout
                target: login

    access_control:
        - { path: ^/health/, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/auth/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/api/plugin/, roles: PUBLIC_ACCESS }
        - { path: ^/api/routes/, roles: ROLE_USER }
        - { path: ^/status$, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
