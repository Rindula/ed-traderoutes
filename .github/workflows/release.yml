name: Create release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build EDMC plugin archive
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("plugin/EDTradeRoutes")
          with ZipFile("dist/ed-traderoutes-edmc-plugin.zip", "w", ZIP_DEFLATED) as archive:
              for path in source.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to("plugin").as_posix())
          PY
          python -m zipfile -t dist/ed-traderoutes-edmc-plugin.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: ED Trade Routes v0.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/ed-traderoutes-edmc-plugin.zip
