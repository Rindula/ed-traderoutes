  OIDC_CLIENT_ID: WQWb0u2ZDxRmvF52np80yib38eChfcOLdJAF2zXJ
  OIDC_CLIENT_SECRET: B2qC6i4E40YEDztwV1gaH3z2hmowXY9NMvgj9C729KzahCqZpxXy0hbLRw6vDG4Si4lX7tfEvcFdk50QWpZF8ocom0I9oXG6b6E9Dtoxey3Smc5n8kxFrfny6OWtSHpT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed-traderoutes-web
  namespace: ed-traderoutes
spec:
  replicas: 2
  selector:
    matchLabels: { app: ed-traderoutes-web }
  template:
    metadata:
      labels: { app: ed-traderoutes-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ed-traderoutes-web
  namespace: ed-traderoutes
spec:
  selector: { app: ed-traderoutes-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed-traderoutes-worker
  namespace: ed-traderoutes
spec:
  replicas: 1
  selector:
    matchLabels: { app: ed-traderoutes-worker }
  template:
    metadata:
      labels: { app: ed-traderoutes-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
          command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
          startupProbe:
            exec: { command: ["php", "bin/console", "about"] }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["php", "bin/console", "about"] }
            periodSeconds: 30
          livenessProbe:
            exec: { command: ["sh", "-c", "kill -0 1"] }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ed-traderoutes
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ed-traderoutes
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: app }
            - { name: POSTGRES_USER, value: app }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ed-traderoutes-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U app -d app"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U app -d app"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # Replace with the cluster's provisioner. This is deliberately explicit.
        # Omit storageClassName to use the cluster's configured default StorageClass.
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ed-traderoutes
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ed-traderoutes
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          args: ["exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ed-traderoutes-secrets, key: REDIS_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"] }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # Keep this equal to the PostgreSQL StorageClass unless the cluster says otherwise.
        # Omit storageClassName to use the cluster's configured default StorageClass.
        resources: { requests: { storage: 5Gi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ed-traderoutes-migrations-v1
  namespace: ed-traderoutes
spec:
  backoffLimit: 3
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args: ["until pg_isready -h postgres -U app -d app; do sleep 2; done"]
      restartPolicy: Never
      containers:
        - name: migrations
          image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
          command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ed-traderoutes-catalog-weekly
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: catalog }
  annotations: { monitoring.ed-traderoutes.io/failure-signal: job-failed }
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: { monitoring: required, workload: catalog }
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: catalog-refresh
              image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
              command: ["sh", "-c"]
              args: ["exec php bin/console \"$CATALOG_REFRESH_COMMAND\" --no-interaction"]
              envFrom:
                - configMapRef: { name: ed-traderoutes-config }
                - secretRef: { name: ed-traderoutes-secrets }
---
# Apply this suspended template once, then set spec.suspend=false for a manual run.
apiVersion: batch/v1
kind: Job
metadata:
  name: ed-traderoutes-catalog-manual
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: catalog, run: manual }
spec:
  suspend: true
  backoffLimit: 4
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { monitoring: required, workload: catalog, run: manual }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: catalog-refresh
          image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
          command: ["sh", "-c"]
          args: ["exec php bin/console \"$CATALOG_REFRESH_COMMAND\" --no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ed-traderoutes-retention-cleanup
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: retention }
  annotations: { monitoring.ed-traderoutes.io/failure-signal: job-failed }
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: { monitoring: required, workload: retention }
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention-cleanup
              image: ghcr.io/rindula/ed-traderoutes:latest@sha256:303dce670e8d5bcc0d61a530c5e583982ab709b5cc542dee274da83c61857b62
              command: ["sh", "-c"]
              args: ["exec php bin/console \"$RETENTION_CLEANUP_COMMAND\" --normalized-retention-days=\"$RETENTION_MARKET_DAYS\" --raw-retention-hours=\"$RETENTION_RAW_EVENT_HOURS\" --no-interaction"]
              envFrom:
                - configMapRef: { name: ed-traderoutes-config }
                - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ed-traderoutes-root-redirect
  namespace: ed-traderoutes
spec:
  redirectRegex:
    regex: ^https://trade-routes\.rindula\.de/$
    replacement: https://trade-routes.rindula.de/dashboard
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ed-traderoutes
  namespace: ed-traderoutes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: ed-traderoutes-root-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [trade-routes.rindula.de]
      secretName: trade-routes-tls
  rules:
    - host: trade-routes.rindula.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ed-traderoutes-web, port: { number: 80 } }
