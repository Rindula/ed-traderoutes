apiVersion: v1
kind: Namespace
metadata:
  name: ed-traderoutes
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ed-traderoutes-operations
  namespace: ed-traderoutes
  labels: { prometheus: kube-prometheus, role: alert-rules }
spec:
  groups:
    - name: ed-traderoutes.operations
      rules:
        - alert: EdTradeRoutesScheduledJobFailed
          expr: max by (namespace, job_name) (kube_job_status_failed{namespace="ed-traderoutes"}) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: ED Trade Routes scheduled job failed
            description: A scheduled ED Trade Routes job has failed and requires investigation.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ed-traderoutes-config
  namespace: ed-traderoutes
data:
  APP_ENV: prod
  OIDC_REDIRECT_URI: https://trade-routes.rindula.de/auth/callback
  # The application image must expose these commands for the scheduled jobs.
  CATALOG_REFRESH_COMMAND: app:catalog:refresh
  RETENTION_CLEANUP_COMMAND: app:cleanup-market-data
  RETENTION_MARKET_DAYS: "30"
  RETENTION_RAW_EVENT_HOURS: "72"
  CATALOG_PROVIDER_COMMAND: "php bin/console app:catalog:refresh"
---
apiVersion: v1
kind: Secret
metadata:
  name: ed-traderoutes-secrets
  namespace: ed-traderoutes
type: Opaque
stringData:
  APP_SECRET: 1b6665bb5bd0552f2b6c306db88bc07dd6826055fa6aadfe06b0dd4367188308
  DATABASE_URL: postgresql://app:de442bc092cd8890d9e00fde1487790e5bef975ff89733a12e511dd506328562@postgres:5432/app?serverVersion=16&charset=utf8
  REDIS_DSN: redis://:7d35a00662c185cb325272df8b1e002e9fc0428557aad640204cdc174dce0a05@redis:6379
  MESSENGER_TRANSPORT_DSN: redis://:7d35a00662c185cb325272df8b1e002e9fc0428557aad640204cdc174dce0a05@redis:6379/messages
  POSTGRES_PASSWORD: de442bc092cd8890d9e00fde1487790e5bef975ff89733a12e511dd506328562
  REDIS_PASSWORD: 7d35a00662c185cb325272df8b1e002e9fc0428557aad640204cdc174dce0a05
