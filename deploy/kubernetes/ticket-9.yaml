apiVersion: v1
kind: Namespace
metadata:
  name: ed-traderoutes
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ed-traderoutes-operations
  namespace: ed-traderoutes
  labels: { prometheus: kube-prometheus, role: alert-rules }
spec:
  groups:
    - name: ed-traderoutes.operations
      rules:
        - alert: EdTradeRoutesScheduledJobFailed
          expr: max by (namespace, job_name) (kube_job_status_failed{namespace="ed-traderoutes"}) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: ED Trade Routes scheduled job failed
            description: A scheduled ED Trade Routes job has failed and requires investigation.
        - alert: EdTradeRoutesBackupMissing
          expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_success_time{namespace="ed-traderoutes", cronjob="ed-traderoutes-postgres-backup"}) > 172800
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: ED Trade Routes backup is stale
            description: No successful PostgreSQL backup has been recorded for 48 hours.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ed-traderoutes-config
  namespace: ed-traderoutes
data:
  APP_ENV: prod
  OIDC_REDIRECT_URI: https://trade-routes.rindula.de/auth/callback
  # The application image must expose these commands for the scheduled jobs.
  CATALOG_REFRESH_COMMAND: app:catalog:refresh
  RETENTION_CLEANUP_COMMAND: app:cleanup-market-data
  RETENTION_MARKET_DAYS: "30"
  RETENTION_RAW_EVENT_HOURS: "72"
  CATALOG_PROVIDER_COMMAND: "php bin/console app:catalog:refresh"
---
apiVersion: v1
kind: Secret
metadata:
  name: ed-traderoutes-secrets
  namespace: ed-traderoutes
type: Opaque
stringData:
  APP_SECRET: replace-me
  DATABASE_URL: postgresql://app:replace-me@postgres:5432/app?serverVersion=16&charset=utf8
  REDIS_DSN: redis://:replace-me@redis:6379
  MESSENGER_TRANSPORT_DSN: redis://:replace-me@redis:6379/messages
  POSTGRES_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  OIDC_AUTHORIZATION_ENDPOINT: https://authentik.example.com/application/o/authorize/
  OIDC_TOKEN_ENDPOINT: https://authentik.example.com/application/o/token/
  OIDC_USERINFO_ENDPOINT: https://authentik.example.com/application/o/userinfo/
  OIDC_JWKS_ENDPOINT: https://authentik.example.com/application/o/.well-known/jwks.json
  OIDC_ISSUER: https://authentik.example.com/application/o/ed-traderoutes/
  OIDC_CLIENT_ID: replace-me
  OIDC_CLIENT_SECRET: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: ed-traderoutes-smb
  namespace: ed-traderoutes
type: Opaque
stringData:
  username: replace-me
  password: replace-me
  domain: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed-traderoutes-web
  namespace: ed-traderoutes
spec:
  replicas: 2
  selector:
    matchLabels: { app: ed-traderoutes-web }
  template:
    metadata:
      labels: { app: ed-traderoutes-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/rindula/ed-traderoutes:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ed-traderoutes-web
  namespace: ed-traderoutes
spec:
  selector: { app: ed-traderoutes-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed-traderoutes-worker
  namespace: ed-traderoutes
spec:
  replicas: 1
  selector:
    matchLabels: { app: ed-traderoutes-worker }
  template:
    metadata:
      labels: { app: ed-traderoutes-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/rindula/ed-traderoutes:latest
          command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
          startupProbe:
            exec: { command: ["php", "bin/console", "about"] }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["php", "bin/console", "about"] }
            periodSeconds: 30
          livenessProbe:
            exec: { command: ["sh", "-c", "kill -0 1"] }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ed-traderoutes
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ed-traderoutes
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: app }
            - { name: POSTGRES_USER, value: app }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ed-traderoutes-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U app -d app"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U app -d app"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # Replace with the cluster's provisioner. This is deliberately explicit.
        # Omit storageClassName to use the cluster's configured default StorageClass.
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ed-traderoutes
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ed-traderoutes
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          args: ["exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ed-traderoutes-secrets, key: REDIS_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"] }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # Keep this equal to the PostgreSQL StorageClass unless the cluster says otherwise.
        # Omit storageClassName to use the cluster's configured default StorageClass.
        resources: { requests: { storage: 5Gi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ed-traderoutes-migrations-v1
  namespace: ed-traderoutes
spec:
  backoffLimit: 3
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args: ["until pg_isready -h postgres -U app -d app; do sleep 2; done"]
      restartPolicy: Never
      containers:
        - name: migrations
          image: ghcr.io/rindula/ed-traderoutes:latest
          command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ed-traderoutes-catalog-weekly
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: catalog }
  annotations: { monitoring.ed-traderoutes.io/failure-signal: job-failed }
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: { monitoring: required, workload: catalog }
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      restartPolicy: OnFailure
      containers:
        - name: catalog-refresh
          image: ghcr.io/rindula/ed-traderoutes:latest
          command: ["sh", "-c"]
          args: ["exec php bin/console \"$CATALOG_REFRESH_COMMAND\" --no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
# Apply this suspended template once, then set spec.suspend=false for a manual run.
apiVersion: batch/v1
kind: Job
metadata:
  name: ed-traderoutes-catalog-manual
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: catalog, run: manual }
spec:
  suspend: true
  backoffLimit: 4
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { monitoring: required, workload: catalog, run: manual }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: catalog-refresh
          image: ghcr.io/rindula/ed-traderoutes:latest
          command: ["sh", "-c"]
          args: ["exec php bin/console \"$CATALOG_REFRESH_COMMAND\" --no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ed-traderoutes-retention-cleanup
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: retention }
  annotations: { monitoring.ed-traderoutes.io/failure-signal: job-failed }
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels: { monitoring: required, workload: retention }
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      restartPolicy: OnFailure
      containers:
        - name: retention-cleanup
          image: ghcr.io/rindula/ed-traderoutes:latest
          command: ["sh", "-c"]
          args: ["exec php bin/console \"$RETENTION_CLEANUP_COMMAND\" --normalized-retention-days=\"$RETENTION_MARKET_DAYS\" --raw-retention-hours=\"$RETENTION_RAW_EVENT_HOURS\" --no-interaction"]
          envFrom:
            - configMapRef: { name: ed-traderoutes-config }
            - secretRef: { name: ed-traderoutes-secrets }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ed-traderoutes-smb-backup
  labels: { workload: postgres-backup }
spec:
  capacity: { storage: 100Gi }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ed-traderoutes-smb
  mountOptions: [dir_mode=0770, file_mode=0660, vers=3.0]
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: ed-traderoutes-smb-backup
    nodeStageSecretRef:
      name: ed-traderoutes-smb
      namespace: ed-traderoutes
    volumeAttributes:
      source: //smb.example.com/ed-traderoutes-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ed-traderoutes-smb-backup
  namespace: ed-traderoutes
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ed-traderoutes-smb
  volumeName: ed-traderoutes-smb-backup
  resources: { requests: { storage: 100Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ed-traderoutes-postgres-backup
  namespace: ed-traderoutes
  labels: { monitoring: required, workload: postgres-backup }
  annotations: { monitoring.ed-traderoutes.io/failure-signal: job-failed }
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    metadata:
      labels: { monitoring: required, workload: postgres-backup }
    spec:
      backoffLimit: 5
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      restartPolicy: OnFailure
      containers:
        - name: postgres-backup
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - set -eu; export PGPASSWORD="$POSTGRES_PASSWORD"; destination="/backup/app-$(date -u +%Y%m%dT%H%M%SZ).dump"; temporary="$destination.part"; trap 'rm -f "$temporary"' EXIT; pg_dump --host=postgres --username=app --dbname=app --format=custom --file="$temporary"; test -s "$temporary"; mv "$temporary" "$destination"; test -s "$destination"; trap - EXIT
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ed-traderoutes-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - name: smb-backup
              mountPath: /backup
      volumes:
        - name: smb-backup
          persistentVolumeClaim: { claimName: ed-traderoutes-smb-backup }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ed-traderoutes
  namespace: ed-traderoutes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [trade-routes.rindula.de]
      secretName: trade-routes-tls
  rules:
    - host: trade-routes.rindula.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ed-traderoutes-web, port: { number: 80 } }
